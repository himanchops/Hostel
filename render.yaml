# Render Blueprint for the hostel backend.
#
# Usage:
#   1. Push this file to your repo on GitHub.
#   2. In Render, click "New" → "Blueprint" → pick this repo.
#   3. Render reads this file, creates the service, and prompts for any
#      env vars marked sync:false (the secrets) — paste them once.
#
# Database, file storage, and frontend are NOT defined here — those live on
# Neon, Cloudflare R2, and Vercel respectively. See docs/DEPLOYMENT.md.

services:
  - type: web
    name: hostel-backend
    runtime: go
    plan: free        # upgrade to "starter" ($7/mo) to keep the service warm
    region: singapore # closest Render region to India
    rootDir: backend
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      # Go toolchain version. backend/go.mod requires go 1.25.7 and carries no
      # `toolchain` directive, so without this Render builds with its own
      # default — which lags — and fails with "go.mod requires go >= 1.25.7",
      # an error that reads like a dependency problem rather than a runtime one.
      # Bump this whenever the go directive in backend/go.mod moves.
      - key: GO_VERSION
        value: "1.25.7"

      # Auto-generated random secret — Render fills this in on first deploy.
      - key: JWT_SECRET
        generateValue: true

      # Postgres connection string from Neon (postgres://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        sync: false

      # The public URL of the deployed frontend on Vercel (used for CORS allow-list).
      - key: FRONTEND_URL
        sync: false

      # The public URL of this backend service on Render (used to build file URLs
      # when STORAGE_BACKEND=local). Safe to leave unset when using S3.
      - key: BASE_URL
        sync: false

      # Storage backend selection.
      - key: STORAGE_BACKEND
        value: s3

      # Cloudflare R2 (or any S3-compatible) settings.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: S3_REGION
        value: auto

      # ── Error tracking ────────────────────────────────────────────────
      # The Sentry (or GlitchTip — same protocol) DSN. sync:false because
      # Render prompts for it rather than storing it in this file.
      #
      # Leaving it unset is a supported state, not a broken one: the server
      # logs "error tracking: DISABLED" at boot and 500s go to stdout only.
      # What must never happen is a DSN that is set but silently failing, so
      # the boot log always says which of the three states it is in.
      - key: SENTRY_DSN
        sync: false

      # Keeps deployed errors out of the same bucket as anything you run
      # locally against the same project.
      - key: SENTRY_ENVIRONMENT
        value: production
