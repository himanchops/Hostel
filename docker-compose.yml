services:
  db:
    image: postgres:16-alpine
    container_name: hostel_db
    environment:
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel_dev
      POSTGRES_DB: hostel
    ports:
      - "5432:5432"
    volumes:
      - hostel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hostel_pgdata: